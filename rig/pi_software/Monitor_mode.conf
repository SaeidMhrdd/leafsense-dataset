sudo ifconfig wlan1 down
sudo iwconfig wlan1 mode monitor
sudo ifconfig wlan1 up
sudo iwconfig wlan1 channel 1






sudo nano /etc/systemd/system/wifi-monitor.service


[Unit]
Description=Set wlan1 to monitor mode and set channel
After=network-online.target
Wants=network-online.target

[Service]
Type=oneshot
ExecStartPre=/bin/sleep 10
ExecStartPre=/sbin/ip link set wlan1 down
ExecStart=/sbin/iw wlan1 set type monitor
ExecStartPost=/bin/sleep 5
ExecStartPost=/sbin/ip link set wlan1 up
ExecStartPost=/sbin/iw wlan1 set channel 1
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target


sudo systemctl daemon-reload
sudo systemctl enable wifi-monitor.service
sudo systemctl start wifi-monitor.service




sudo systemctl restart wifi-monitor.service
